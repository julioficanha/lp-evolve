<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Espaço reservado para a fotografia da equipe Evolve">
  <defs>
    <linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E7E0"/><stop offset="1" stop-color="#D8D5CB"/>
    </linearGradient>
    <filter id="ge"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/></filter>
  </defs>
  <rect width="800" height="620" fill="url(#fe)"/>

  <!-- cinco silhuetas lado a lado, como um retrato de equipe -->
  <g fill="#02173B" opacity="0.19">
    <g transform="translate(172 0)"><circle cx="0" cy="356" r="44"/><path d="M -78 620 C -76 452 -40 410 0 410 C 40 410 76 452 78 620 Z"/></g>
    <g transform="translate(288 0)"><circle cx="0" cy="330" r="48"/><path d="M -84 620 C -82 436 -44 390 0 390 C 44 390 82 436 84 620 Z"/></g>
    <g transform="translate(404 0)"><circle cx="0" cy="316" r="50"/><path d="M -88 620 C -86 426 -46 376 0 376 C 46 376 86 426 88 620 Z"/></g>
    <g transform="translate(520 0)"><circle cx="0" cy="330" r="48"/><path d="M -84 620 C -82 436 -44 390 0 390 C 44 390 82 436 84 620 Z"/></g>
    <g transform="translate(632 0)"><circle cx="0" cy="356" r="44"/><path d="M -78 620 C -76 452 -40 410 0 410 C 40 410 76 452 78 620 Z"/></g>
  </g>

  <g transform="translate(400 172)">
    <g transform="translate(-21 -52) scale(0.42)" fill="none" stroke="#9B512F" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <path d="M 36 36 L 22 50 C 16 56 16 64 22 70 L 50 98 L 78 70 C 84 64 84 56 78 50 L 64 36"/>
      <path d="M 50 2 C 64 16 64 36 50 46 C 36 56 36 76 50 90 C 64 76 64 56 50 46 C 36 36 36 16 50 2 Z"/>
    </g>
    <text y="26" font-family="Montserrat, sans-serif" font-size="15" font-weight="600" letter-spacing="2.6" text-anchor="middle" fill="#4A5A6E">FOTO DA EQUIPE EVOLVE</text>
    <text y="50" font-family="Montserrat, sans-serif" font-size="11.5" letter-spacing="1.5" text-anchor="middle" fill="#7E7161">imagem provisória</text>
  </g>

  <rect x="0.5" y="0.5" width="799" height="619" fill="none" stroke="#02173B" stroke-opacity="0.12" stroke-dasharray="9 7"/>
  <rect width="800" height="620" filter="url(#ge)" fill="#02173B"/>
</svg>