<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Ilustração de uma carta aberta sobre a mesa">
  <defs>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2444"/><stop offset="1" stop-color="#02173B"/>
    </linearGradient>
    <linearGradient id="papel" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FBFAF7"/><stop offset="0.55" stop-color="#F2F0EA"/><stop offset="1" stop-color="#E4E1D8"/>
    </linearGradient>
    <linearGradient id="dobra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.10"/><stop offset="0.25" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="graozinho"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="800" height="620" fill="url(#mesa)"/>
  <ellipse cx="400" cy="330" rx="360" ry="250" fill="#7E9BB5" opacity="0.10"/>

  <!-- envelope ao fundo -->
  <g transform="rotate(-7 400 340)" opacity="0.92">
    <rect x="176" y="250" width="448" height="286" rx="4" fill="#DCD6C8" filter="url(#sombra)"/>
    <path d="M 176 250 L 400 404 L 624 250" fill="none" stroke="#B9B1A0" stroke-width="2.5"/>
  </g>

  <!-- folha principal -->
  <g transform="rotate(3.2 400 310)">
    <rect x="212" y="92" width="392" height="456" rx="3" fill="url(#papel)" filter="url(#sombra)"/>
    <rect x="212" y="92" width="392" height="456" rx="3" fill="url(#dobra)"/>

    <!-- marca Evolve no topo da folha -->
    <g transform="translate(252 136) scale(0.30)" fill="none" stroke="#9B512F" stroke-width="6" stroke-linecap="round">
      <path d="M 36 36 L 22 50 C 16 56 16 64 22 70 L 50 98 L 78 70 C 84 64 84 56 78 50 L 64 36"/>
      <path d="M 50 2 C 64 16 64 36 50 46 C 36 56 36 76 50 90 C 64 76 64 56 50 46 C 36 36 36 16 50 2 Z"/>
    </g>
    <text x="288" y="152" font-family="Georgia, serif" font-size="15" letter-spacing="3.4" fill="#02173B">EVOLVE</text>

    <line x1="252" y1="176" x2="564" y2="176" stroke="#9B512F" stroke-width="1.4" opacity="0.5"/>

    <!-- saudação -->
    <text x="252" y="214" font-family="Georgia, serif" font-size="21" font-style="italic" fill="#02173B">Ao empresário,</text>

    <!-- linhas de texto -->
    <g fill="#7E7161" opacity="0.42">
      <rect x="252" y="238" width="312" height="5" rx="2.5"/>
      <rect x="252" y="256" width="298" height="5" rx="2.5"/>
      <rect x="252" y="274" width="306" height="5" rx="2.5"/>
      <rect x="252" y="292" width="242" height="5" rx="2.5"/>
      <rect x="252" y="322" width="304" height="5" rx="2.5"/>
      <rect x="252" y="340" width="288" height="5" rx="2.5"/>
      <rect x="252" y="358" width="310" height="5" rx="2.5"/>
      <rect x="252" y="376" width="196" height="5" rx="2.5"/>
      <rect x="252" y="406" width="284" height="5" rx="2.5"/>
      <rect x="252" y="424" width="258" height="5" rx="2.5"/>
    </g>

    <!-- frase em destaque -->
    <rect x="252" y="452" width="216" height="6" rx="3" fill="#9B512F" opacity="0.72"/>

    <!-- assinatura manuscrita -->
    <path d="M 258 508 C 276 486 288 522 306 500 C 322 480 334 516 352 496 C 366 482 378 508 396 498"
          fill="none" stroke="#02173B" stroke-width="2.4" stroke-linecap="round" opacity="0.78"/>
    <line x1="252" y1="524" x2="396" y2="524" stroke="#7E7161" stroke-width="1" opacity="0.34"/>
  </g>

  <rect width="800" height="620" filter="url(#graozinho)" fill="#EFEFED"/>
</svg>